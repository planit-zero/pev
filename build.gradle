plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.14'
    id 'io.spring.dependency-management' version '1.1.2'
    id 'com.github.node-gradle.node' version '7.0.1'
}

group = 'ai.planit'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '11'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.68.Final:osx-aarch_64'
    implementation 'com.google.code.gson:gson:2.8.9'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.1'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.vertica.jdbc:vertica-jdbc:11.0.2-0'
    runtimeOnly files('src/main/libs/VerticaDialect.jar')

    implementation 'com.oracle.ojdbc:orai18n:19.3.0.0'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'

    implementation "jakarta.xml.bind:jakarta.xml.bind-api:2.3.2"
    implementation "org.glassfish.jaxb:jaxb-runtime:2.3.2"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets {
    main {
        java {
            srcDirs = ["$projectDir/src/main/java", "$projectDir/build/generated"]
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

node {
    download = false
    version = '16.20.1'
    yarnVersion = '1.22.19'
    workDir = file("${project.projectDir}/.gradle/nodejs")
    yarnWorkDir = file("${project.projectDir}/.gradle/yarn")
    nodeProjectDir = file("${project.projectDir}/src/main/webapp")
}

def buildDir = file("${project.projectDir}/src/main/webapp/build")
def staticDir = file("${project.projectDir}/src/main/resources/static")

task cleanBuildAndStatic(type: Delete) {
    doFirst {
        delete buildDir
        delete staticDir
    }

    doLast {
        staticDir.mkdir()
    }
}

task yarnInstall(type: YarnTask) {
    args = ['install']
}

task yarnBuild(type: YarnTask) {
    args = ['build']
}

task copyBuildToStatic(type: Copy) {
    from buildDir
    into staticDir
}

task removeBuild(type: Delete) {
    delete buildDir
}

yarnInstall.dependsOn(cleanBuildAndStatic)
yarnBuild.dependsOn(yarnInstall)
copyBuildToStatic.dependsOn(yarnBuild)
removeBuild.dependsOn(copyBuildToStatic)
processResources.dependsOn(removeBuild)
